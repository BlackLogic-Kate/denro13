[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/assets/bot/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Black Friday 2026: старая ссылка /blackfriday ведет на холодную версию
[[redirects]]
  from = "/blackfriday"
  to = "/coldbf/"
  status = 301
[[redirects]]
  from = "/blackfriday/*"
  to = "/coldbf/"
  status = 301
